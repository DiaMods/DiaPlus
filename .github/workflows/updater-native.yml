name: Validate native updater handoff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Real graceful quit and independent installer lifetime (no credentials)
        run: node --test bridge/test/installer-native.test.js bridge/test/installer-handoff.test.js
